name: Build Windows Portable

on:
  push:
    branches: [main]
    paths:
      - 'QuickDictateWindows/**'
  pull_request:
    paths:
      - 'QuickDictateWindows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build QuickDictate Windows
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: QuickDictateWindows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: QuickDictateWindows/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: QuickDictateWindows/src-tauri

      - name: Install npm dependencies
        run: npm install

      - name: Generate icons
        run: |
          npx @tauri-apps/cli icon ../BlitztextMac/Resources/Assets.xcassets/AppIcon.appiconset/icon_512x512.png
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: QuickDictate-Windows-portable
          path: |
            QuickDictateWindows/src-tauri/target/release/quickdictate-windows.exe
          retention-days: 14

      - name: Upload installer (optional)
        uses: actions/upload-artifact@v4
        with:
          name: QuickDictate-Windows-installer
          path: |
            QuickDictateWindows/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
        continue-on-error: true
