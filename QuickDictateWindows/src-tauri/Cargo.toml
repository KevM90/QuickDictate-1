[package]
name = "quickdictate-windows"
version = "1.0.0"
description = "QuickDictate Windows Portable App"
authors = ["QuickDictate contributors"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

cpal = "0.15"
hound = "3"
reqwest = { version = "0.12", features = ["multipart", "json"] }
keyring = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
